
<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Füsun Bağırlı — İnsan resursları üzrə ekspert, mentor, təlimçi və spiker.">
  <title>Füsun Bağırlı | HR Expert & Trainer</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f8f7f4;
      color: #252525;
      line-height: 1.7;
    }

    header {
      background: #172b4d;
      color: white;
      padding: 22px 8%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 15px;
    }

    .logo {
      font-size: 21px;
      font-weight: bold;
      letter-spacing: 1px;
    }

    nav a {
      color: white;
      text-decoration: none;
      margin-left: 22px;
      font-size: 14px;
    }

    nav a:hover {
      color: #d8b878;
    }

    .hero {
      min-height: 510px;
      padding: 100px 10%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      background: linear-gradient(135deg, #172b4d, #29466d);
      color: white;
    }

    .eyebrow {
      color: #e1c58e;
      text-transform: uppercase;
      letter-spacing: 3px;
      font-size: 13px;
      margin-bottom: 18px;
    }

    h1 {
      font-size: clamp(42px, 7vw, 76px);
      line-height: 1.1;
      margin-bottom: 22px;
    }

    .hero p {
      max-width: 650px;
      font-size: 19px;
      color: #e5eaf2;
      margin-bottom: 30px;
    }

    .button {
      display: inline-block;
      background: #d8b878;
      color: #172b4d;
      padding: 13px 24px;
      border-radius: 4px;
      text-decoration: none;
      font-weight: bold;
      width: fit-content;
    }

    section {
      padding: 75px 10%;
    }

    section h2 {
      color: #172b4d;
      font-size: 32px;
      margin-bottom: 25px;
    }

    .about {
      max-width: 900px;
      font-size: 17px;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 22px;
    }

    .card {
      background: white;
      padding: 28px;
      border-radius: 8px;
      border: 1px solid #e9e5dc;
    }

    .card h3 {
      color: #172b4d;
      margin-bottom: 12px;
      font-size: 19px;
    }

    .card p {
      color: #555;
      font-size: 15px;
    }

    .experience {
      background: #efede7;
    }

    .highlight {
      color: #172b4d;
      font-size: 28px;
      font-weight: bold;
      display: block;
      margin-bottom: 5px;
    }

    .education-item {
      padding: 18px 0;
      border-bottom: 1px solid #ddd8cd;
    }

    .education-item h3 {
      color: #172b4d;
      margin-bottom: 5px;
    }

    .quote {
      background: #172b4d;
      color: white;
      text-align: center;
      padding: 65px 10%;
    }

    .quote p {
      font-size: clamp(23px, 4vw, 36px);
      font-weight: bold;
      max-width: 850px;
      margin: 0 auto 15px;
    }

    .quote span {
      color: #d8b878;
    }

    .contact {
      text-align: center;
    }

    .contact p {
      margin-bottom: 25px;
    }

    footer {
      background: #101e35;
      color: #d5dbe5;
      text-align: center;
      padding: 25px;
      font-size: 13px;
    }

    @media (max-width: 600px) {
      header {
        padding: 20px 6%;
      }

      nav a {
        margin-left: 0;
        margin-right: 15px;
      }

      .hero {
        padding: 75px 7%;
      }

      section {
        padding: 55px 7%;
      }
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">FÜSUN BAĞIRLI</div>
    <nav>
      <a href="#about">Haqqımda</a>
      <a href="#expertise">İxtisaslaşma</a>
      <a href="#experience">Təcrübə</a
